<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLE MIDI Test</title><style>body{font:18px system-ui;background:#121826;color:white;padding:24px}button{font-size:20px;padding:16px}pre{white-space:pre-wrap;overflow-wrap:anywhere}#note{font-size:50px}</style><h1>Prueba BLE MIDI</h1><button id="go">Conectar Casio</button><button id="off">Desconectar</button><p id="state">Sin conectar</p><div id="note">—</div><pre id="log"></pre><script>
const svc='03b80e5a-ede8-4b33-a751-6ce34ec4c700',chr='7772e5db-3868-4112-a1a9-f2669d106bf3';let dev;const log=s=>{document.querySelector('#log').textContent+=s+'\n'},state=s=>{document.querySelector('#state').textContent=s;log(s)};
document.querySelector('#go').onclick=async()=>{try{if(!navigator.bluetooth)throw Error('Web Bluetooth no disponible. Abre desde HTTPS.');state('Buscando servicio BLE MIDI...');dev=await navigator.bluetooth.requestDevice({filters:[{services:[svc]}]});log('Encontrado: '+dev.name);dev.addEventListener('gattserverdisconnected',()=>state('Desconectado'));state('Conectando GATT...');const server=await Promise.race([dev.gatt.connect(),new Promise((_,r)=>setTimeout(()=>r(Error('GATT tardó más de 15 segundos')),15000))]);state('GATT conectado');const service=await server.getPrimaryService(svc);state('Servicio MIDI encontrado');const characteristic=await service.getCharacteristic(chr);await characteristic.startNotifications();characteristic.addEventListener('characteristicvaluechanged',e=>{const a=new Uint8Array(e.target.value.buffer,e.target.value.byteOffset,e.target.value.byteLength);log('MIDI HEX: '+Array.from(a,x=>x.toString(16).padStart(2,'0')).join(' '));for(let i=2;i<a.length-2;i++){if((a[i]&240)===144&&(a[i+1]&128)===0){let n=a[i+1],v=a[i+2],names=['Do','Do#','Re','Re#','Mi','Fa','Fa#','Sol','Sol#','La','La#','Si'];document.querySelector('#note').textContent=v?names[n%12]+(Math.floor(n/12)-1):'—';}}});state('¡Recibiendo! Toca el Casio.')}catch(e){state('ERROR '+e.name+': '+e.message)}};document.querySelector('#off').onclick=()=>dev?.gatt?.disconnect();
</script></html>
